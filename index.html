<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vicky Nishad — Systems & ML Engineer</title>
  <meta name="description" content="Personal landing page of Vicky Nishad, featuring an interactive 3D particle field projection engine.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070a;
      --text: #f3f3f7;
      --text-muted: #8e8e9f;
      --accent: #00ffaa;
      --accent-glow: rgba(0, 255, 170, 0.25);
      --font-sans: 'Outfit', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Full-screen 3D Canvas */
    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: all;
    }

    /* Glassmorphic Central Identity Card */
    .profile-card {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 420px;
      background: rgba(13, 13, 18, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      transform: translateY(0);
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    .profile-card:hover {
      border-color: rgba(0, 255, 170, 0.15);
      box-shadow: 0 24px 64px rgba(0, 255, 170, 0.03);
    }

    .monogram {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      width: 48px;
      height: 48px;
      border: 1px solid rgba(0, 255, 170, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      text-shadow: 0 0 10px var(--accent-glow);
      box-shadow: inset 0 0 8px var(--accent-glow);
    }

    .name {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    .title {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.8rem 1.5rem;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border: 1px solid var(--text);
    }
    .btn-primary:hover {
      background: transparent;
      color: var(--text);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-secondary:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.02);
    }
  </style>
</head>
<body>

  <!-- Background 3D Engine -->
  <canvas id="canvas3d"></canvas>

  <!-- Identity Card -->
  <div class="profile-card">
    <div class="monogram">VN</div>
    <h1 class="name">Vicky Nishad</h1>
    <p class="title">Systems, ML &amp; Deployment Engineer</p>
    
    <div class="nav-links">
      <a href="/bah2026-proposal/" class="btn btn-primary">
        Explore BAH-2026 Proposal
      </a>
      <a href="https://github.com/Vickyrrrrrr" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
        GitHub Profile
      </a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas3d');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // 3D Grid Parameters
    const columns = 36;
    const rows = 36;
    const spacingX = 80;
    const spacingY = 80;
    
    let time = 0;
    let mouse = { x: width / 2, y: height / 2, tx: width / 2, ty: height / 2 };

    window.addEventListener('mousemove', (e) => {
      mouse.tx = e.clientX;
      mouse.ty = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.tx = e.touches[0].clientX;
        mouse.ty = e.touches[0].clientY;
      }
    }, { passive: true });

    // Perspective Projection Function
    function project3d(x, y, z) {
      // Rotate grid slightly around X-axis for angle perspective
      const cosX = Math.cos(1.0);
      const sinX = Math.sin(1.0);
      
      const rotY = y * cosX - z * sinX;
      const rotZ = y * sinX + z * cosX;
      
      // Perspective scaling
      const fov = 600;
      const distance = 800;
      const scale = fov / (distance + rotZ);
      
      const projX = width / 2 + x * scale;
      const projY = height / 2 + rotY * scale;
      
      return { x: projX, y: projY, depth: rotZ };
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Smooth mouse tracking interpolation
      mouse.x += (mouse.tx - mouse.x) * 0.05;
      mouse.y += (mouse.ty - mouse.y) * 0.05;

      time += 0.015;

      // Draw horizontal and vertical grid strings
      const projectedGrid = [];

      for (let r = 0; r < rows; r++) {
        projectedGrid[r] = [];
        for (let c = 0; c < columns; c++) {
          // Center origin coordinates
          const startX = (c - columns / 2) * spacingX;
          const startY = (r - rows / 2) * spacingY;

          // Distances for wave calculations
          const dx = startX - (mouse.x - width / 2);
          const dy = startY - (mouse.y - height / 2);
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          // Ripple equations combining time and mouse gravity
          const waveVal = Math.sin(dist * 0.01 - time * 2) * 55;
          const mouseG = Math.max(0, 200 - dist) * 0.45;
          const z = waveVal + mouseG;

          projectedGrid[r][c] = project3d(startX, startY, z);
        }
      }

      // Draw connection strings with depth cueing
      ctx.lineWidth = 1;

      for (let r = 0; r < rows - 1; r++) {
        for (let c = 0; c < columns - 1; c++) {
          const p1 = projectedGrid[r][c];
          const p2 = projectedGrid[r][c + 1];
          const p3 = projectedGrid[r + 1][c];

          // Calculate visual alpha based on depth (fog effect)
          const maxZ = 1200;
          const depthAlpha = Math.max(0, 1.0 - (p1.depth + 400) / maxZ);
          
          // Skip drawing if invisible
          if (depthAlpha <= 0) continue;

          // Interpolate color from deep purple to neon cyan based on point depth
          const depthColor = Math.min(255, Math.max(0, intScale(p1.depth, -200, 300, 160, 280)));
          ctx.strokeStyle = `hsla(${depthColor}, 90%, 55%, ${depthAlpha * 0.22})`;

          // Horizontal line
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();

          // Vertical line
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p3.x, p3.y);
          ctx.stroke();
        }
      }

      requestAnimationFrame(animate);
    }

    // Helper: linear scaling mapping
    function intScale(val, inMin, inMax, outMin, outMax) {
      return ((val - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
    }

    animate();
  </script>
</body>
</html>
